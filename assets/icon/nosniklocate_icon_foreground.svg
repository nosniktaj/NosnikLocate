<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Purple gradient for the pin -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BB86FC"/>
      <stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.612
                0 0 0 0 0.153
                0 0 0 0 0.690
                0 0 0 0.5 0" result="glowColor"/>
      <feMerge>
        <feMergeNode in="glowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Foreground only: location pin with glow (no background) -->
  <g filter="url(#glow)">
    <!-- Pin body -->
    <path d="M256 56c-72 0-130 58-130 130 0 97.5 130 247 130 247s130-149.5 130-247c0-72-58-130-130-130z"
          fill="url(#pinGradient)"/>
    <!-- Inner circle of the pin -->
    <circle cx="256" cy="186" r="60" fill="#1A1A2E"/>
    <!-- Letter N inside the pin -->
    <text x="256" y="203" font-family="Arial, Helvetica, sans-serif" font-weight="bold"
          font-size="68" fill="url(#pinGradient)" text-anchor="middle" dominant-baseline="middle">N</text>
  </g>
</svg>
